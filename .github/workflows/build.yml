name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the apk branch
        run: |
          mkdir /tmp/apkout
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/apkout/firelauncher.apk
          cd /tmp/apkout
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add firelauncher.apk
          git commit -q -m "Built APK"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
